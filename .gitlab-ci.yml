variables:
  PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip' # Change pip's cache directory to be inside the project directory since we can only cache local items.
  API_DOMAIN_PATH: '$CI_PROJECT_DIR/api_domain'
  UV_INDEX_URL: "https://europe-north1-python.pkg.dev/holi-shared/pypi-remote/simple/"
  PIP_INDEX_URL: "https://europe-north1-python.pkg.dev/holi-shared/pypi-remote/simple/"
  PIP_TRUSTED_HOST: "europe-north1-python.pkg.dev"

.uv_cache_rw:
  policy: pull-push
  key:
    files:
      - "uv.lock"
  paths:
    - .uv-cache

.uv_cache_ro:
  key:
    files:
      - "uv.lock"
  policy: pull
  paths:
    - .uv-cache

stages:
  - 'validate'
  - 'build'
  - 'deploy'
  - 'smoketest'
  - 'downstream'
  - 'destroy'

default:
  before_script:
    - set -eu
    # DANGER don't use `set -x` or print the environment via e.g. `env` in pipeline runs, this might leak credentials (has leaked them)
  interruptible: true
  tags:
    - 1cpu-4gb # build on smaller machine

validate:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/holi-okuna-builder:latest'
  cache: !reference [ .uv_cache_rw ]
  services:
    - name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/postgis/postgis:17-3.4'
      alias: postgres
  stage: 'validate'
  variables:
    SECRET_KEY: 'secret'
    POSTGRES_DB: okuna_test_db
    POSTGRES_USER: okuna_test_user
    POSTGRES_PASSWORD: okuna_test_pass
    POSTGRES_HOST_AUTH_METHOD: trust
    UV_CACHE_DIR: .uv-cache
  before_script:
    - uv --version
    - uv sync --locked --link-mode=copy
  script: |
    /etc/init.d/redis-server start
    uv run ruff check --output-format=gitlab | tee .gl-lint-report.json
    uv run ruff format --diff
    uv run pytest --cov
    # remove pre-built wheels from cache, keep source-built wheels (see https://docs.astral.sh/uv/concepts/cache/#caching-in-continuous-integration)
    uv cache prune --ci
  artifacts:
    reports:
      codequality:
        - .gl-lint-report.json
  tags:
    - 4cpu-4gb # more cpu, quicker testing

alert_matching_on_migrations:
  stage: validate
  image:
    name: alpine/git:latest
    entrypoint: [ "" ]
  before_script:
    - apk add --no-cache curl
  only:
    - main
  script:
    - scripts/notify-matching-on-migrations.sh

build_docker:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:28'
  cache: !reference [ .uv_cache_ro ]
  stage: 'build'
  services:
    - name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:28-dind'
      alias: 'docker'
  variables:
    # this could be fetched via terraform output ("gcr_location" in infra project), but then we would need an extra job for terraform
    GCR_IMAGE: europe-north1-docker.pkg.dev/holi-shared/docker/holi-okuna
    UV_CACHE_DIR: .uv-cache
  script:
    - docker pull "$GCR_IMAGE" || true # Allows us to use --cache-from, we need to tag with latest in the next command for this to work
    - docker build --cache-from "$GCR_IMAGE" -t "$GCR_IMAGE":latest -t "$GCR_IMAGE":"$CI_COMMIT_SHA" -t "$GCR_IMAGE":"$CI_COMMIT_REF_SLUG" .
    - docker push "$GCR_IMAGE":"$CI_COMMIT_SHA" # this is the tag used for deployment
    - docker push "$GCR_IMAGE":"$CI_COMMIT_REF_SLUG" # just for easily knowing which is the last image for a branch
    - docker push "$GCR_IMAGE":latest # for caching the build
  tags:
    - 4cpu-4gb # more cpu, quicker image build

.deploy:
  stage: 'deploy'
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/terraform-gcloud'
    # default entrypoint is terraform command, but we want to run shell scripts
    # entrypoint: ["/bin/sh", "-c"]
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  artifacts:
    paths:
      - 'terraform/environments/crash.log' # optional, only available in case of a crash/panic
      - 'terraform/environments/terraform-*.log' # separate log for every step/command
      - $API_DOMAIN_PATH
    name: '${CI_JOB_NAME}_${CI_JOB_ID}'
    #when: on_failure # can't do that for api base url, but can't define multiple artifacts
    expire_in: 1 week
  cache: [] # explicitly disable cache
  script:
    # gcloud auth is needed for the migration, triggered via gcloud command
    - gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
    - terraform/environments/scripts/create-or-update-env.sh "$ENVIRONMENT_ID" "$CI_COMMIT_SHA"
    - echo "$(terraform/environments/scripts/get-output.sh api_domain)" > "$API_DOMAIN_PATH"
  resource_group: $ENVIRONMENT_ID # never execute terraform in parallel on the same environment
  interruptible: false

.smoketest:
  stage: 'smoketest'
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/holi-k6-builder'
  cache: [] # explicitly disable cache
  script:
    - API_DOMAIN=$(cat "$API_DOMAIN_PATH")
    - terraform/environments/scripts/wait-for-ssl.sh "https://${API_DOMAIN}"
    - BASE_URL="https://${API_DOMAIN}/graphql" k6 run smoketest/main.js
    # TODO should/could we roll back the service to the last working revision on test failure?

review_deploy:
  extends: .deploy
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://$CI_ENVIRONMENT_SLUG.social.apis.holi.social
    on_stop: review_destroy
    auto_stop_in: 1 week
  except:
    - main
    - production
    - /^noenv\/.*/

review_smoketest:
  extends: .smoketest
  except:
    - main
    - production
    - /^noenv\/.*/

review_destroy:
  stage: destroy
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.13.4'
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ['/bin/sh', '-c']
  variables:
    # has to be set to none for auto stop
    GIT_STRATEGY: none
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  dependencies: [] # explicitly disable artifact usage
  cache: [] # explicitly disable cache
  artifacts:
    paths:
      - 'terraform/environments/crash.log' # optional, only available in case of a crash/panic
      - 'terraform/environments/terraform-*.log' # separate log for every step/command
    name: '${CI_JOB_NAME}_${CI_JOB_ID}'
    when: on_failure
    expire_in: 1 week
  script:
    # branch may have been deleted, so we clone and checkout main
    - git clone "$CI_REPOSITORY_URL" main-clone
    - cd main-clone
    - terraform/environments/scripts/destroy-env.sh "$CI_ENVIRONMENT_SLUG"
  # can't use rules here: https://gitlab.com/gitlab-org/gitlab/-/issues/34077
  when: manual
  allow_failure: true
  except:
    - main
    - production
    - /^noenv\/.*/
  resource_group: $CI_ENVIRONMENT_SLUG # never execute terraform in parallel on the same environment
  interruptible: false

staging_deploy:
  extends: .deploy
  environment:
    name: staging
    deployment_tier: staging
    url: https://staging.social.apis.holi.social
  variables:
    ENVIRONMENT_ID: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

staging_smoketest:
  extends: .smoketest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

staging_trigger_unified-api_redeployment:
  stage: downstream
  trigger:
    project: 'app/holi-unified-api'
    branch: 'main'
    forward:
      yaml_variables: false
      pipeline_variables: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  resource_group: unified-api-staging

production_deploy:
  extends: .deploy
  allow_failure: false
  environment:
    name: production
    deployment_tier: production
    url: https://production.social.apis.holi.social
  variables:
    ENVIRONMENT_ID: production
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: on_success

production_smoketest:
  extends: .smoketest
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: on_success

production_trigger_unified-api_redeployment:
  stage: downstream
  trigger:
    project: 'app/holi-unified-api'
    branch: 'production'
    forward:
      yaml_variables: false
      pipeline_variables: false
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: on_success
  resource_group: unified-api-production
