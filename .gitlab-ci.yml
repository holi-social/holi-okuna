variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip" # Change pip's cache directory to be inside the project directory since we can only cache local items.
  API_BASE_URL_PATH: "$CI_PROJECT_DIR/api_domain"

cache:
  key:
    files:
      - requirements.txt # hashes this file so cache content depends on files content
  paths:
    - /root/.cache/pip
    - .cache/pip
    - venv/

stages:
  - "setup"
  - "test"
  - "build"
  - "deploy"
  - "destroy"

default:
  before_script:
    - set -eux
    - env
  interruptible: true
  tags:
    - 1cpu-4gb # build on smaller machine

setup:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/holi-okuna-builder"
  stage: "setup"
  script:
    - python3 -m venv venv
    - source venv/bin/activate
    #- pip install --upgrade pip
    - pip install -r requirements.txt --exists-action s

unit-test:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/holi-okuna-builder"
  services:
    - name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/postgis/postgis:12-3.3-alpine'
      alias: postgres
  stage: "test"
  variables:
    SECRET_KEY: "secret"
    POSTGRES_DB: okuna_test_db
    POSTGRES_USER: okuna_test_user
    POSTGRES_PASSWORD: okuna_test_pass
    POSTGRES_HOST_AUTH_METHOD: trust
  script:
    - /etc/init.d/redis-server start
    - source venv/bin/activate
    - python -m pytest --cov
  tags:
    - 4cpu-4gb # more cpu, quicker testing

lint:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/holi-okuna-builder"
  stage: test
  variables:
    GIT_STRATEGY: clone
    GIT_CHECKOUT: "false"
  before_script:
    - git fetch --all
    - git checkout $CI_COMMIT_REF_NAME
    - export COMPARISON_SHA=$(git merge-base $CI_COMMIT_REF_NAME origin/$CI_DEFAULT_BRANCH)
    - source venv/bin/activate
  script:
    # exit early if there are no files to check
    - '[[ -z "$(git diff --name-only --diff-filter=d $COMPARISON_SHA..$CI_COMMIT_SHA -- "*.py")" ]] && exit 0'
    # runs ruff (linter and formatter) on all changed files, excluding deleted files.
    # this will also force changes on offending unchanged lines in changed files, but we accept that in the spirit of
    # leaving every file better than we found it.
    - 'git diff --name-only -z --diff-filter=d $COMPARISON_SHA..$CI_COMMIT_SHA -- "*.py" | xargs -0 ruff check --force-exclude --output-format=gitlab | tee .gl-lint-report.json'
    - 'git diff --name-only -z --diff-filter=d $COMPARISON_SHA..$CI_COMMIT_SHA -- "*.py" | xargs -0 ruff format --force-exclude --diff'
  artifacts:
    reports:
      codequality:
        - .gl-lint-report.json
  except:
    - main
    - production
    - release/*

build_docker:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:20.10'
  stage: "build"
  services:
    - docker:20.10-dind
  variables:
    # this could be fetched via terraform output ("gcr_location" in infra project), but then we would need an extra job for terraform
    GCR_IMAGE: europe-north1-docker.pkg.dev/holi-shared/docker/holi-okuna
  before_script:
    - cat $GOOGLE_CLOUD_SERVICE_ACCOUNT | docker login -u _json_key --password-stdin https://europe-north1-docker.pkg.dev
  script:
    - docker pull $GCR_IMAGE || true # Allows us to use --cache-from, we need to tag with latest in the next command for this to work
    - docker build --cache-from $GCR_IMAGE -t $GCR_IMAGE:latest -t $GCR_IMAGE:$CI_COMMIT_SHA -t $GCR_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $GCR_IMAGE:$CI_COMMIT_SHA # this is the tag that is used for deployment
    - docker push $GCR_IMAGE:$CI_COMMIT_REF_SLUG # just for easily knowing which is the last image for a branch
    - docker push $GCR_IMAGE:latest # for caching the build
  tags:
    - 4cpu-4gb # more cpu, quicker image build

.deploy:
  stage: "deploy"
  image:
    name: "europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/terraform-gcloud"
    # default entrypoint is terraform command, but we want to run shell scripts
    # entrypoint: ["/bin/sh", "-c"]
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  artifacts:
    paths:
      - "terraform/environments/crash.log" # optional, only available in case of a crash/panic
      - "terraform/environments/terraform-*.log" # separate log for every step/command
      - $API_BASE_URL_PATH
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    #when: on_failure # can't do that for api base url, but can't define multiple artifacts
    expire_in: 1 week
  script:
    - gcloud auth activate-service-account --key-file=$GOOGLE_APPLICATION_CREDENTIALS
    - terraform/environments/scripts/create-or-update-env.sh $ENVIRONMENT_ID $CI_COMMIT_SHA
    - echo "$(terraform/environments/scripts/get-output.sh api_domain)" > $API_BASE_URL_PATH
  resource_group: $ENVIRONMENT_ID # never execute terraform in parallel on the same environment
  interruptible: false

.e2e:
  stage: "deploy"
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/archlinux:base'
  script:
    - API_BASE_URL=`cat $API_BASE_URL_PATH`
    - echo "e2e tests against $CI_ENVIRONMENT_SLUG environment go here and against $API_BASE_URL"
    - terraform/environments/scripts/wait-for-ssl.sh "https://${API_BASE_URL}"

review_deploy:
  extends: .deploy
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://$CI_ENVIRONMENT_SLUG.social.apis.holi.social
    on_stop: review_destroy
    auto_stop_in: 1 week
  except:
    - main
    - production
    - /^noenv\/.*/

review_destroy:
  stage: destroy
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.6.1'
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ["/bin/sh", "-c"]
  variables:
    # has to be set to none for auto stop
    GIT_STRATEGY: none
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  dependencies: [] # explicitly disable artifact usage
  script:
    - export GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_CLOUD_SERVICE_ACCOUNT}
    # branch may have been deleted, so we clone and checkout main
    - git clone $CI_REPOSITORY_URL main-clone
    - cd main-clone
    - terraform/environments/scripts/destroy-env.sh $CI_ENVIRONMENT_SLUG
  # can't use rules here: https://gitlab.com/gitlab-org/gitlab/-/issues/34077
  when: manual
  allow_failure: false
  except:
    - main
    - production
    - /^noenv\/.*/
  resource_group: $CI_ENVIRONMENT_SLUG # never execute terraform in parallel on the same environment
  interruptible: false

staging_deploy:
  extends: .deploy
  environment:
    name: staging
    deployment_tier: staging
    url: https://staging.social.apis.holi.social
  variables:
    ENVIRONMENT_ID: staging
  only:
    - main

staging_trigger_unified-api_redeployment:
  needs: ['staging_deploy']
  stage: deploy
  trigger:
    project: 'app/holi-unified-api'
    branch: 'main'
  only:
    - main

# TODO: e2e tests

production_deploy:
  extends: .deploy
  allow_failure: false
  environment:
    name: production
    deployment_tier: production
    url: https://production.social.apis.holi.social
  variables:
    ENVIRONMENT_ID: production
  only:
    - production

production_trigger_unified-api_redeployment:
  needs: ['production_deploy']
  stage: deploy
  trigger:
    project: 'app/holi-unified-api'
    branch: 'production'
  only:
    - production
