version: '3'

services:
  db:
    image: ghcr.io/baosystems/postgis:12-3.3
    container_name: okuna-postgres
    hostname: db.okuna
    volumes:
     - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    privileged: false
    networks:
      okuna:
        ipv4_address: 172.16.16.4
    env_file:
      - .docker-compose.env
  redis:
    image: arm64v8/redis:latest
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass $REDIS_PASSWORD --host $REDIS_HOST --port $REDIS_PORT
    container_name: okuna-redis
    privileged: false
    ports:
      - 6380:6379
    networks:
      okuna:
        ipv4_address: 172.16.16.5
    env_file:
      - .docker-compose.env
    volumes:
      - redisdb:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf

volumes:
  postgres:
  redisdb:

networks:
  okuna:
    ipam:
      driver: default
      config:
        - subnet: "172.16.16.0/16"
