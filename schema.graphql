type Query {
  """
  
  
  Equivalent to GET /api/auth/user/
  """
  apiAuthUser: String
}

type Mutation {
  """
  
  
  Equivalent to PATCH /api/auth/user/
  """
  apiAuthUserPartialUpdate(patchedUpdateAuthenticatedUserInput: PatchedUpdateAuthenticatedUserInput): String
}

input PatchedUpdateAuthenticatedUserInput {
  aboutMe: String
  avatar: String
  communityPostsVisible: Boolean
  cover: String
  engagementLevel: String
  followersCountVisible: Boolean
  interests: JSON
  lastName: String
  location: String
  middleName: String
  name: String
  password: String
  pronouns: String
  sdgs: JSON
  skills: JSON
  url: String
  username: String
  visibility: VisibilityEnum
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON @specifiedBy(url: "http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf")

enum VisibilityEnum {
  P
  T
  O
}
