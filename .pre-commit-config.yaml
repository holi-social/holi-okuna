repos:
#-   repo: https://github.com/dorschw/riff
#    rev: main
#    hooks:
#    -   id: riff
#        additional_dependencies: ["ruff>=0.0.291"] # minimal is 0.0.291
-   repo: local
    hooks:
    -   id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks protect --staged -v -c ../.gitleaks.toml
        pass_filenames: false
        always_run: true
    -   id: ruff
        name: ruff
        language: system
        entry: utils/scripts/ruff-changed.sh
        pass_filenames: false
        always_run: true
