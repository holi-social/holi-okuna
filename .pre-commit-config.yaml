
repos:
# see https://github.com/dorschw/riff/issues/106
#  - repo: https://github.com/dorschw/riff
#    rev: main
#    hooks:
#      - id: riff
#        additional_dependencies: ["ruff>=0.0.291"] # minimal is 0.0.291
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        language: system
        entry: utils/scripts/ruff.sh
        pass_filenames: false
        always_run: true
  - repo: git@gitlab-holi:app/holi-meta.git
    rev: 6f2fe467b05362ba73936969f325eb87e291d85b
    hooks:
      - id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks protect --staged -v -c ../.gitleaks.toml
        pass_filenames: false
        always_run: true
      - id: scan-comments
        name: scan-comments
        entry: ../scripts/scan-comments.sh .
        language: system
        pass_filenames: true
        always_run: true
        verbose: true
      - id: security-checks
        name: security-checks
        entry: ../scripts/security-checks.sh .
        language: system
        pass_filenames: true
        always_run: true
        verbose: true
