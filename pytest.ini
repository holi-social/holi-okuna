[pytest]
python_files = tests.py test_*.py *_tests.py
python_classes = *Tests Test*
addopts = -v -n auto -p no:warnings --ds=openbook.settings.testing --strict-markers --cov --no-migrations --reuse-db --ignore=.venv --ignore=media --ignore=locale --ignore=docs --ignore=.run --ignore=utils --ignore=terraform --ignore=reports --ignore=reports --ignore=static
markers =
   slow: marks tests as slow
   serial