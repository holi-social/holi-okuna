[pytest]
python_files = test_*.py
python_classes = *Tests Test*
addopts =
    -v
    -n auto
    -p no:warnings
    -k "not test_views.py"
    --ds=openbook.settings.testing
    --ignore=.run
    --ignore=.venv
    --ignore=docs
    --ignore=locale
    --ignore=media
    --ignore=reports
    --ignore=static
    --ignore=templates
    --ignore=terraform
    --ignore=utils
    --ignore=openbook_auth/tests/views
    --ignore=openbook_categories/tests/views
    --ignore=openbook_circles/tests/views
    --ignore=openbook_common/tests/views
    --ignore=openbook_communities/tests/views
    --ignore=openbook_connections/tests/views
    --ignore=openbook_devices/tests/views
    --ignore=openbook_follows/tests/views
    --ignore=openbook_hashtags/tests/views
    --ignore=openbook_importer/tests/views
    --ignore=openbook_insights/tests/views
    --ignore=openbook_invitations/tests/views
    --ignore=openbook_lists/tests/views
    --ignore=openbook_moderation/tests/views
    --ignore=openbook_notifications/tests/views
    --ignore=openbook_posts/tests/views
    --ignore=openbook_tags/tests/views
    --ignore=openbook_terms/tests/views
    --ignore=test_views.py
