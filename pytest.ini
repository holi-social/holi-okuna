[pytest]
python_files = test_*.py
python_classes = *Tests Test*
addopts =
    -v
    -n auto
    -p no:warnings
    --ds=openbook.settings.testing
    --cov
    --ignore=.run
    --ignore=.venv
    --ignore=docs
    --ignore=locale
    --ignore=media
    --ignore=reports
    --ignore=static
    --ignore=templates
    --ignore=terraform
    --ignore=utils
