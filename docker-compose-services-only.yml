version: '3'

services:
  worker:
    container_name: okuna-worker
    build:
      dockerfile: Dockerfile
      context: ./.docker/worker
    privileged: true
    extra_hosts:
      - db.okuna:172.16.16.4
      - redis.okuna:172.16.16.5
    volumes:
      - ./:/opt/okuna-api
      - ./.docker-cache/pip:/root/.cache/pip
    working_dir: /opt/okuna-api
    networks:
      okuna:
        ipv4_address: 172.16.16.2
    depends_on:
      - db
      - redis
    env_file:
      - .docker-compose.env
  scheduler:
    container_name: okuna-scheduler
    build:
      dockerfile: Dockerfile
      context: ./.docker/scheduler
    privileged: true
    extra_hosts:
      - db.okuna:172.16.16.4
      - redis.okuna:172.16.16.5
    volumes:
      - ./:/opt/okuna-api
      - ./.docker-cache/pip:/root/.cache/pip
    working_dir: /opt/okuna-api
    networks:
      okuna:
        ipv4_address: 172.16.16.3
    depends_on:
      - db
      - redis
    env_file:
      - .docker-compose.env
  db:
    image: postgres:14.2-alpine
    container_name: okuna-postgres
    hostname: db.okuna
    volumes:
     - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    privileged: false
    networks:
      okuna:
        ipv4_address: 172.16.16.4
    env_file:
      - .docker-compose.env
  redis:
    image: bitnami/redis:latest
    container_name: okuna-redis
    privileged: false
    ports:
      - 6380:6379
    networks:
      okuna:
        ipv4_address: 172.16.16.5
    env_file:
      - .docker-compose.env
    volumes:
      - redisdb:/bitnami/redis/data

volumes:
  postgres:
  redisdb:

networks:
  okuna:
    ipam:
      driver: default
      config:
        - subnet: "172.16.16.0/16"
